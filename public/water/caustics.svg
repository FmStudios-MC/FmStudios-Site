<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Pool caustics: turbulence creases turned into bright veins. The ridge
       is shaped on R before R becomes alpha, so no dark fringes appear.
       stitchTiles plus whole noise cycles per tile keeps it seamless. -->
  <filter id="c" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.00833" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="1 0.5 0.1 0 0 0 0 0"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.902  0 0 0 0 0.839  1 0 0 0 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#c)"/>
</svg>
